<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Forge Super Agent</title>
  <desc id="desc">Forge AI engineering studio with multi-model routing, 333 skills, browser automation, work mode and Windows Electron runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#101A31"/>
      <stop offset="1" stop-color="#08131F"/>
    </linearGradient>
    <linearGradient id="forge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B8DFF"/>
      <stop offset="0.55" stop-color="#55D8FF"/>
      <stop offset="1" stop-color="#F4C668"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55D8FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#55D8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="1600" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1260" cy="120" r="300" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="300" cy="600" r="260" fill="#8B8DFF" opacity="0.12" filter="url(#blur)"/>

  <g opacity="0.14" stroke="#55D8FF">
    <path d="M0 112H1600M0 224H1600M0 336H1600M0 448H1600M0 560H1600"/>
    <path d="M160 0V640M320 0V640M480 0V640M640 0V640M800 0V640M960 0V640M1120 0V640M1280 0V640M1440 0V640"/>
  </g>

  <g transform="translate(104 114)" filter="url(#shadow)">
    <rect width="312" height="312" rx="72" fill="#0D1628" stroke="#293A5A" stroke-width="2"/>
    <path d="M92 80h146l-26 40H127l-15 26h78l-25 39h-76l-36 60h-52L92 80z" fill="url(#forge)" transform="translate(36 6)"/>
    <circle cx="156" cy="156" r="126" fill="none" stroke="url(#forge)" stroke-width="3" opacity="0.65"/>
    <circle cx="156" cy="156" r="108" fill="none" stroke="#55D8FF" stroke-width="1" opacity="0.32" stroke-dasharray="8 12"/>
  </g>

  <g transform="translate(492 112)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="62" font-size="28" font-weight="700" fill="#55D8FF" letter-spacing="4">FORGE SUPER AGENT</text>
    <text x="0" y="132" font-size="64" font-weight="800" fill="#F7FAFF">AI engineering,</text>
    <text x="0" y="202" font-size="64" font-weight="800" fill="url(#forge)">from intent to verified change.</text>
    <text x="0" y="258" font-size="25" fill="#AEBBD0">Multi-model routing • 333 skills • browser automation • Work Mode • Electron IDE</text>

    <g transform="translate(0 304)" font-size="19" font-weight="700">
      <g><rect width="190" height="52" rx="16" fill="#121F37" stroke="#324A73"/><text x="22" y="33" fill="#E8EEFA">⚡ Super Agent</text></g>
      <g transform="translate(206)"><rect width="170" height="52" rx="16" fill="#121F37" stroke="#324A73"/><text x="22" y="33" fill="#E8EEFA">🧠 333 Skills</text></g>
      <g transform="translate(392)"><rect width="210" height="52" rx="16" fill="#121F37" stroke="#324A73"/><text x="22" y="33" fill="#E8EEFA">🌐 Playwright Browser</text></g>
      <g transform="translate(618)"><rect width="185" height="52" rx="16" fill="#121F37" stroke="#324A73"/><text x="22" y="33" fill="#E8EEFA">🪟 Windows Gate</text></g>
    </g>

    <g transform="translate(0 390)" font-size="17">
      <circle cx="10" cy="10" r="8" fill="#54E38E"/><text x="28" y="17" fill="#BFD0E8">Contracts</text>
      <circle cx="168" cy="10" r="8" fill="#54E38E"/><text x="186" y="17" fill="#BFD0E8">Compile</text>
      <circle cx="300" cy="10" r="8" fill="#54E38E"/><text x="318" y="17" fill="#BFD0E8">Runtime Guard</text>
      <circle cx="500" cy="10" r="8" fill="#54E38E"/><text x="518" y="17" fill="#BFD0E8">Provider Routing</text>
      <circle cx="720" cy="10" r="8" fill="#54E38E"/><text x="738" y="17" fill="#BFD0E8">Smoke Test</text>
    </g>
