name: Forge One-Shot Semantic UI Validate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-one-shot-semantic-ui-validate.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Apply semantic-search UI fix
        run: python3 scripts/apply-forge-semantic-ui-fix.py
      - name: Apply final orchestration compatibility fix
        run: python3 scripts/apply-forge-orchestration-final-fix.py
      - name: Apply autonomous coding runtime
        run: python3 scripts/apply-forge-autonomous-runtime-v1.py
      - name: Run fast Forge contracts
        run: |
          node scripts/forge-agent-tool-contract-test.mjs
          node scripts/forge-ui-contract-test.mjs
          node scripts/forge-react-service-export-contract.mjs
          node scripts/forge-autonomous-runtime-contract-test.mjs
      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3 pkg-config poppler-utils
      - name: Install dependencies
        run: npm ci --foreground-scripts
      - name: Compile core TypeScript
        run: npm run compile
      - name: Build Forge React UI
        run: npm run buildreact
      - name: Verify runtime artifacts
        env:
          FORGE_SKIP_REACT_REBUILD: '1'
        run: node scripts/forge-runtime-guard.mjs
      - name: Commit validated fix
        run: |
          git config user.name 'forge-fix-bot'
          git config user.email 'forge-fix-bot@users.noreply.github.com'
          git add src/vs/workbench/contrib/void/browser/react/src/sidebar-tsx/SidebarChat.tsx \
                  src/vs/workbench/contrib/void/common/toolActivityMessages.ts \
                  src/vs/workbench/contrib/void/browser/react/src/workspace-tsx/components/ChatView.tsx \
                  src/vs/workbench/contrib/void/browser/react/src/workspace-tsx/utils/slashCommandRouter.tsx \
                  src/vs/workbench/contrib/void/browser/react/src/workspace-tsx/utils/autonomousTaskPolicy.ts \
                  scripts/forge-agent-tool-contract-test.mjs \
                  scripts/forge-runtime-guard.mjs \
                  scripts/forge-autonomous-runtime-contract-test.mjs \
                  scripts/forge-mcp-server.mjs \
                  scripts/forge-document-reader.mjs \
                  scripts/forge-document-reader.py
          git diff --cached --check
          git commit -m 'feat: complete Forge autonomous coding runtime'
          git push origin HEAD:main
