name: Forge Full Runtime Validate

# Maintained source is committed in PRs. Full builds are explicit and never push code.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Run fast Forge contracts
        run: |
          node scripts/forge-agent-tool-contract-test.mjs
          node scripts/forge-ui-contract-test.mjs
          node scripts/forge-react-service-export-contract.mjs
          node scripts/forge-autonomous-runtime-contract-test.mjs
      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3 pkg-config poppler-utils
      - name: Install dependencies
        run: npm ci --foreground-scripts
      - name: Compile core TypeScript
        run: npm run compile
      - name: Build Forge React UI
        run: npm run buildreact
      - name: Verify runtime artifacts
        env:
          FORGE_SKIP_REACT_REBUILD: '1'
        run: node scripts/forge-runtime-guard.mjs
