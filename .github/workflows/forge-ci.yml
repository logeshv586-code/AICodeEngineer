name: Forge Agent CI (Manual Storage-Safe)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-agent-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-forge-check:
    name: Manual Forge core validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use repository Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install Linux native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3 pkg-config xvfb

      - name: Install dependencies
        run: npm ci --foreground-scripts

      - name: Run Forge contract checks
        run: |
          node scripts/forge-brand-contract-test.mjs
          node scripts/forge-ui-contract-test.mjs
          node scripts/forge-native-setup-contract.mjs
          node scripts/forge-react-service-export-contract.mjs
          node scripts/forge-model-provider-contract-test.mjs
          node scripts/forge-agent-tool-contract-test.mjs
          node scripts/forge-work-self-test.mjs
          node scripts/manage-skills.mjs validate

      - name: Compile core TypeScript
        run: npm run compile

      - name: Build Forge React UI
        run: npm run buildreact

      - name: Verify runtime artifacts locally only
        run: node scripts/forge-runtime-guard.mjs

      - name: Live Forge Electron UI smoke
        run: xvfb-run -a node scripts/forge-welcome-smoke-test.mjs
