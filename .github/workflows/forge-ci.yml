name: Forge Agent CI

on:
  push:
    branches: [main]
    paths:
      - 'src/vs/workbench/contrib/void/**'
      - 'scripts/**'
      - '.agents/**'
      - 'skill_library/**'
      - 'skill_registry.json'
      - 'forge-integrations.lock.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/forge-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/vs/workbench/contrib/void/**'
      - 'scripts/**'
      - '.agents/**'
      - 'skill_library/**'
      - 'skill_registry.json'
      - 'forge-integrations.lock.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/forge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, UI contracts, skills, runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: UI contract test
        run: node scripts/forge-ui-contract-test.mjs

      - name: Work Mode queue and claim test
        run: node scripts/forge-work-self-test.mjs

      - name: Validate 333-skill library
        run: node scripts/manage-skills.mjs validate

      - name: Compile core TypeScript
        run: npm run compile

      - name: Build Forge React UI
        run: npm run buildreact

      - name: Verify runtime artifacts
        run: node scripts/forge-runtime-guard.mjs
