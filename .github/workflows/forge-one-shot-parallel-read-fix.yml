name: Forge One-Shot Parallel Read Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-one-shot-parallel-read-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted Forge orchestration patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (file, before, after) => {
            const original = fs.readFileSync(file, 'utf8');
            const count = original.split(before).length - 1;
            if (count !== 1) throw new Error(`${file}: expected exactly one match, found ${count}`);
            fs.writeFileSync(file, original.replace(before, after));
          };

          // 1) Type the optional parallel read/search targets without changing canonical tool names.
          replaceOnce(
            'src/vs/workbench/contrib/void/common/toolsServiceTypes.ts',
            `\t'read_file': { uri: URI, startLine: number | null, endLine: number | null, pageNumber: number },\n\t'ls_dir': { uri: URI, pageNumber: number },\n\t'get_dir_tree': { uri: URI },\n\t'search_pathnames_only': { query: string, includePattern: string | null, pageNumber: number },\n\t'search_for_files': { query: string, isRegex: boolean, searchInFolder: URI | null, pageNumber: number },\n\t'search_in_file': { uri: URI, query: string, isRegex: boolean },\n\t'semantic_search': { query: string, top_k?: number },`,
            `\t'read_file': { uri: URI, uris?: URI[], startLine: number | null, endLine: number | null, pageNumber: number },\n\t'ls_dir': { uri: URI, pageNumber: number },\n\t'get_dir_tree': { uri: URI },\n\t'search_pathnames_only': { query: string, queries?: string[], includePattern: string | null, pageNumber: number },\n\t'search_for_files': { query: string, queries?: string[], isRegex: boolean, searchInFolder: URI | null, pageNumber: number },\n\t'search_in_file': { uri: URI, query: string, isRegex: boolean },\n\t'semantic_search': { query: string, queries?: string[], top_k?: number },`
          );

          // 2) Teach the model to batch independent read-only work and preserve native array arguments as JSON strings.
          replaceOnce(
            'src/vs/workbench/contrib/void/common/prompt/prompts.ts',
            `\tread_file: {\n\t\tname: 'read_file',\n\t\tdescription: \`Read file contents with explicit paging metadata. COMPLETE means the requested content is complete. MORE_PAGES means call read_file again with the next page_number. Never ask the user to paste a local file that this tool can read.\`,\n\t\tparams: {\n\t\t\t...uriParam('file'),`,
            `\tread_file: {\n\t\tname: 'read_file',\n\t\tdescription: \`Read file contents with explicit paging metadata. COMPLETE means the requested content is complete. MORE_PAGES means call read_file again with the next page_number. Never ask the user to paste a local file that this tool can read. Independent files may be read concurrently by passing a JSON array in uri.\`,\n\t\tparams: {\n\t\t\turi: { description: 'One full/relative file path, or a JSON array of up to 6 file paths to read concurrently.' },`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/common/prompt/prompts.ts',
            `\t\t\tquery: { description: \`Filename/path query.\` },`,
            `\t\t\tquery: { description: \`One filename/path query, or a JSON array of up to 6 independent queries to run concurrently.\` },`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/common/prompt/prompts.ts',
            `\t\t\tquery: { description: \`Text or regex to search for.\` },`,
            `\t\t\tquery: { description: \`One text/regex query, or a JSON array of up to 6 independent queries to run concurrently.\` },`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/common/prompt/prompts.ts',
            `\t\t\tquery: { description: \`Natural-language code concept or implementation query.\` },`,
            `\t\t\tquery: { description: \`One natural-language code concept, or a JSON array of up to 6 independent concepts to search concurrently.\` },`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/common/prompt/prompts.ts',
            `\t\trawParams[canonicalName] = typeof value === 'string'\n\t\t\t? value\n\t\t\t: canonicalName === 'search_replace_blocks' ? JSON.stringify(value) : String(value)`,
            `\t\tconst preserveStructuredValue = canonicalName === 'search_replace_blocks'\n\t\t\t|| ((canonicalName === 'uri' || canonicalName === 'query') && Array.isArray(value))\n\t\trawParams[canonicalName] = typeof value === 'string'\n\t\t\t? value\n\t\t\t: preserveStructuredValue ? JSON.stringify(value) : String(value)`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/common/prompt/prompts.ts',
            `\t\tdetails.push('If an exact filename/path or active file is already known, read/search it directly instead of performing unnecessary discovery.')`,
            `\t\tdetails.push('If an exact filename/path or active file is already known, read/search it directly instead of performing unnecessary discovery.')\n\t\tdetails.push('When several independent files or search queries are needed, batch up to 6 of them in one read_file/search call using the documented JSON-array form. This parallel batching is for read-only discovery only; keep dependent operations and edits serialized.')`
          );

          // 3) Parse compact JSON arrays safely.
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `const validateOptionalStr = (argName: string, str: unknown) => {`,
            `const validateStringList = (argName: string, value: unknown, maxItems = 6): string[] => {\n\tlet values: unknown[]\n\tif (Array.isArray(value)) values = value\n\telse {\n\t\tconst raw = validateStr(argName, value).trim()\n\t\tif (!raw.startsWith('[')) values = [raw]\n\t\telse {\n\t\t\ttry { values = JSON.parse(raw) }\n\t\t\tcatch { throw new Error(\`Invalid LLM output: \\${argName} looked like a JSON array but could not be parsed.\`) }\n\t\t}\n\t}\n\tif (!Array.isArray(values) || values.length === 0) throw new Error(\`Invalid LLM output: \\${argName} must contain at least one value.\`)\n\tif (values.length > maxItems) throw new Error(\`Invalid LLM output: \\${argName} supports at most \\${maxItems} parallel values.\`)\n\treturn values.map((item, index) => {\n\t\tif (typeof item !== 'string' || !item.trim()) throw new Error(\`Invalid LLM output: \\${argName}[\\${index}] must be a non-empty string.\`)\n\t\treturn item.trim()\n\t})\n}\n\nconst validateOptionalStr = (argName: string, str: unknown) => {`
          );

          // 4) Validate list forms while keeping the first item as the legacy UI target.
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `\t\t\t\tconst uri = await resolveWorkspaceURI(uriStr)\n\t\t\t\tconst pageNumber = validatePageNum(pageNumberUnknown)`,
            `\t\t\t\tconst uriStrings = validateStringList('uri', uriStr)\n\t\t\t\tconst uris = await Promise.all(uriStrings.map(resolveWorkspaceURI))\n\t\t\t\tconst uri = uris[0]\n\t\t\t\tconst pageNumber = validatePageNum(pageNumberUnknown)`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `\t\t\t\treturn { uri, startLine, endLine, pageNumber }`,
            `\t\t\t\treturn { uri, uris: uris.length > 1 ? uris : undefined, startLine, endLine, pageNumber }`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `\t\t\t\tconst queryStr = validateStr('query', queryUnknown)\n\t\t\t\tconst pageNumber = validatePageNum(pageNumberUnknown)\n\t\t\t\tconst includePattern = validateOptionalStr('include_pattern', includeUnknown)\n\n\t\t\t\treturn { query: queryStr, includePattern, pageNumber }`,
            `\t\t\t\tconst queryStrings = validateStringList('query', queryUnknown)\n\t\t\t\tconst queryStr = queryStrings[0]\n\t\t\t\tconst pageNumber = validatePageNum(pageNumberUnknown)\n\t\t\t\tconst includePattern = validateOptionalStr('include_pattern', includeUnknown)\n\n\t\t\t\treturn { query: queryStr, queries: queryStrings.length > 1 ? queryStrings : undefined, includePattern, pageNumber }`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `\t\t\t\tconst queryStr = validateStr('query', queryUnknown)\n\t\t\t\tconst pageNumber = validatePageNum(pageNumberUnknown)\n\t\t\t\tconst searchInFolder = isFalsy(searchInFolderUnknown) ? null : await resolveWorkspaceURI(searchInFolderUnknown)\n\t\t\t\tconst isRegex = validateBoolean(isRegexUnknown, { default: false })\n\t\t\t\treturn {\n\t\t\t\t\tquery: queryStr,\n\t\t\t\t\tisRegex,\n\t\t\t\t\tsearchInFolder,\n\t\t\t\t\tpageNumber\n\t\t\t\t}`,
            `\t\t\t\tconst queryStrings = validateStringList('query', queryUnknown)\n\t\t\t\tconst queryStr = queryStrings[0]\n\t\t\t\tconst pageNumber = validatePageNum(pageNumberUnknown)\n\t\t\t\tconst searchInFolder = isFalsy(searchInFolderUnknown) ? null : await resolveWorkspaceURI(searchInFolderUnknown)\n\t\t\t\tconst isRegex = validateBoolean(isRegexUnknown, { default: false })\n\t\t\t\treturn {\n\t\t\t\t\tquery: queryStr,\n\t\t\t\t\tqueries: queryStrings.length > 1 ? queryStrings : undefined,\n\t\t\t\t\tisRegex,\n\t\t\t\t\tsearchInFolder,\n\t\t\t\t\tpageNumber\n\t\t\t\t}`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `\t\t\t\tconst query = validateStr('query', queryUnknown);\n\t\t\t\tconst topK = validateNumber(topKUnknown, { default: 5 }) || 5;\n\t\t\t\treturn { query, top_k: topK };`,
            `\t\t\t\tconst queryStrings = validateStringList('query', queryUnknown);\n\t\t\t\tconst query = queryStrings[0];\n\t\t\t\tconst topK = validateNumber(topKUnknown, { default: 5 }) || 5;\n\t\t\t\treturn { query, queries: queryStrings.length > 1 ? queryStrings : undefined, top_k: topK };`
          );

          // 5) Read independent files concurrently with a smaller per-file batch page to protect context windows.
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `\t\t\tread_file: async ({ uri, startLine, endLine, pageNumber }) => {\n\t\t\t\tawait voidModelService.initializeModel(uri)\n\t\t\t\tconst { model } = await voidModelService.getModelSafe(uri)\n\t\t\t\tif (model === null) { throw new Error(\`No contents; File does not exist.\`) }\n\n\t\t\t\tlet contents: string\n\t\t\t\tif (startLine === null && endLine === null) {\n\t\t\t\t\tcontents = model.getValue(EndOfLinePreference.LF)\n\t\t\t\t}\n\t\t\t\telse {\n\t\t\t\t\tconst startLineNumber = startLine === null ? 1 : startLine\n\t\t\t\t\tconst endLineNumber = endLine === null ? model.getLineCount() : endLine\n\t\t\t\t\tcontents = model.getValueInRange({ startLineNumber, startColumn: 1, endLineNumber, endColumn: Number.MAX_SAFE_INTEGER }, EndOfLinePreference.LF)\n\t\t\t\t}\n\n\t\t\t\tconst totalNumLines = model.getLineCount()\n\n\t\t\t\tconst fromIdx = MAX_FILE_CHARS_PAGE * (pageNumber - 1)\n\t\t\t\tconst toIdx = MAX_FILE_CHARS_PAGE * pageNumber - 1\n\t\t\t\tconst fileContents = contents.slice(fromIdx, toIdx + 1) // paginate\n\t\t\t\tconst hasNextPage = (contents.length - 1) - toIdx >= 1\n\t\t\t\tconst totalFileLen = contents.length\n\t\t\t\treturn { result: { fileContents, totalFileLen, hasNextPage, totalNumLines } }\n\t\t\t},`,
            `\t\t\tread_file: async ({ uri, uris, startLine, endLine, pageNumber }) => {\n\t\t\t\tconst targets = uris?.length ? uris : [uri]\n\t\t\t\tconst isBatch = targets.length > 1\n\t\t\t\tconst pageSize = isBatch ? Math.min(MAX_FILE_CHARS_PAGE, 100_000) : MAX_FILE_CHARS_PAGE\n\n\t\t\t\tconst readOne = async (target: URI) => {\n\t\t\t\t\tawait voidModelService.initializeModel(target)\n\t\t\t\t\tconst { model } = await voidModelService.getModelSafe(target)\n\t\t\t\t\tif (model === null) { throw new Error(\`No contents; File does not exist: \\${target.fsPath}.\`) }\n\n\t\t\t\t\tlet contents: string\n\t\t\t\t\tif (startLine === null && endLine === null) contents = model.getValue(EndOfLinePreference.LF)\n\t\t\t\t\telse {\n\t\t\t\t\t\tconst startLineNumber = startLine === null ? 1 : startLine\n\t\t\t\t\t\tconst endLineNumber = endLine === null ? model.getLineCount() : endLine\n\t\t\t\t\t\tcontents = model.getValueInRange({ startLineNumber, startColumn: 1, endLineNumber, endColumn: Number.MAX_SAFE_INTEGER }, EndOfLinePreference.LF)\n\t\t\t\t\t}\n\n\t\t\t\t\tconst fromIdx = pageSize * (pageNumber - 1)\n\t\t\t\t\tconst toIdx = pageSize * pageNumber - 1\n\t\t\t\t\treturn {\n\t\t\t\t\t\turi: target,\n\t\t\t\t\t\tfileContents: contents.slice(fromIdx, toIdx + 1),\n\t\t\t\t\t\ttotalFileLen: contents.length,\n\t\t\t\t\t\ttotalNumLines: model.getLineCount(),\n\t\t\t\t\t\thasNextPage: (contents.length - 1) - toIdx >= 1,\n\t\t\t\t\t}\n\t\t\t\t}\n\n\t\t\t\tconst pages = await Promise.all(targets.map(readOne))\n\t\t\t\tif (!isBatch) {\n\t\t\t\t\tconst page = pages[0]\n\t\t\t\t\treturn { result: { fileContents: page.fileContents, totalFileLen: page.totalFileLen, hasNextPage: page.hasNextPage, totalNumLines: page.totalNumLines } }\n\t\t\t\t}\n\n\t\t\t\tconst fileContents = pages.map(page => {\n\t\t\t\t\tconst status = page.hasNextPage ? 'MORE_PAGES' : 'COMPLETE'\n\t\t\t\t\treturn \`===== FILE \\${page.uri.fsPath} =====\\n[READ_FILE \\${status} page=\\${pageNumber} returned_chars=\\${page.fileContents.length} total_chars=\\${page.totalFileLen} total_lines=\\${page.totalNumLines}]\\n\\${page.fileContents}\\n[END_FILE \\${status}]\`\n\t\t\t\t}).join('\\n\\n')\n\t\t\t\treturn {\n\t\t\t\t\tresult: {\n\t\t\t\t\t\tfileContents,\n\t\t\t\t\t\ttotalFileLen: pages.reduce((sum, page) => sum + page.totalFileLen, 0),\n\t\t\t\t\t\ttotalNumLines: pages.reduce((sum, page) => sum + page.totalNumLines, 0),\n\t\t\t\t\t\thasNextPage: pages.some(page => page.hasNextPage),\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t},`
          );

          // 6) Parallelize independent filename/content searches and deduplicate their union.
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `\t\t\tsearch_pathnames_only: async ({ query: queryStr, includePattern, pageNumber }) => {\n\n\t\t\t\tconst query = queryBuilder.file(workspaceContextService.getWorkspace().folders.map(f => f.uri), {\n\t\t\t\t\tfilePattern: queryStr,\n\t\t\t\t\tincludePattern: includePattern ?? undefined,\n\t\t\t\t\tsortByScore: true, // makes results 10x better\n\t\t\t\t})\n\t\t\t\tconst data = await searchService.fileSearch(query, CancellationToken.None)\n\n\t\t\t\tconst fromIdx = MAX_CHILDREN_URIs_PAGE * (pageNumber - 1)\n\t\t\t\tconst toIdx = MAX_CHILDREN_URIS_PAGE * pageNumber - 1\n\t\t\t\tconst uris = data.results\n\t\t\t\t\t.slice(fromIdx, toIdx + 1) // paginate\n\t\t\t\t\t.map(({ resource, results }) => resource)\n\n\t\t\t\tconst hasNextPage = (data.results.length - 1) - toIdx >= 1\n\t\t\t\treturn { result: { uris, hasNextPage } }\n\t\t\t},`,
            `\t\t\tsearch_pathnames_only: async ({ query: queryStr, queries, includePattern, pageNumber }) => {\n\t\t\t\tconst queryStrings = queries?.length ? queries : [queryStr]\n\t\t\t\tconst searchOne = async (pattern: string) => {\n\t\t\t\t\tconst query = queryBuilder.file(workspaceContextService.getWorkspace().folders.map(f => f.uri), {\n\t\t\t\t\t\tfilePattern: pattern,\n\t\t\t\t\t\tincludePattern: includePattern ?? undefined,\n\t\t\t\t\t\tsortByScore: true,\n\t\t\t\t\t})\n\t\t\t\t\tconst data = await searchService.fileSearch(query, CancellationToken.None)\n\t\t\t\t\tconst fromIdx = MAX_CHILDREN_URIS_PAGE * (pageNumber - 1)\n\t\t\t\t\tconst toIdx = MAX_CHILDREN_URIS_PAGE * pageNumber - 1\n\t\t\t\t\treturn {\n\t\t\t\t\t\turis: data.results.slice(fromIdx, toIdx + 1).map(({ resource }) => resource),\n\t\t\t\t\t\thasNextPage: (data.results.length - 1) - toIdx >= 1,\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tconst pages = await Promise.all(queryStrings.map(searchOne))\n\t\t\t\tconst seen = new Set<string>()\n\t\t\t\tconst uris: URI[] = []\n\t\t\t\tfor (const page of pages) for (const resultUri of page.uris) {\n\t\t\t\t\tconst key = resultUri.toString()\n\t\t\t\t\tif (!seen.has(key)) { seen.add(key); uris.push(resultUri) }\n\t\t\t\t}\n\t\t\t\treturn { result: { uris, hasNextPage: pages.some(page => page.hasNextPage) } }\n\t\t\t},`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `\t\t\tsearch_for_files: async ({ query: queryStr, isRegex, searchInFolder, pageNumber }) => {\n\t\t\t\tconst searchFolders = searchInFolder === null ?\n\t\t\t\t\tworkspaceContextService.getWorkspace().folders.map(f => f.uri)\n\t\t\t\t\t: [searchInFolder]\n\n\t\t\t\tconst query = queryBuilder.text({\n\t\t\t\t\tpattern: queryStr,\n\t\t\t\t\tisRegExp: isRegex,\n\t\t\t\t}, searchFolders)\n\n\t\t\t\tconst data = await searchService.textSearch(query, CancellationToken.None)\n\n\t\t\t\tconst fromIdx = MAX_CHILDREN_URIS_PAGE * (pageNumber - 1)\n\t\t\t\tconst toIdx = MAX_CHILDREN_URIS_PAGE * pageNumber - 1\n\t\t\t\tconst uris = data.results\n\t\t\t\t\t.slice(fromIdx, toIdx + 1) // paginate\n\t\t\t\t\t.map(({ resource, results }) => resource)\n\n\t\t\t\tconst hasNextPage = (data.results.length - 1) - toIdx >= 1\n\t\t\t\treturn { result: { queryStr, uris, hasNextPage } }\n\t\t\t},`,
            `\t\t\tsearch_for_files: async ({ query: queryStr, queries, isRegex, searchInFolder, pageNumber }) => {\n\t\t\t\tconst searchFolders = searchInFolder === null ? workspaceContextService.getWorkspace().folders.map(f => f.uri) : [searchInFolder]\n\t\t\t\tconst queryStrings = queries?.length ? queries : [queryStr]\n\t\t\t\tconst searchOne = async (pattern: string) => {\n\t\t\t\t\tconst query = queryBuilder.text({ pattern, isRegExp: isRegex }, searchFolders)\n\t\t\t\t\tconst data = await searchService.textSearch(query, CancellationToken.None)\n\t\t\t\t\tconst fromIdx = MAX_CHILDREN_URIS_PAGE * (pageNumber - 1)\n\t\t\t\t\tconst toIdx = MAX_CHILDREN_URIS_PAGE * pageNumber - 1\n\t\t\t\t\treturn {\n\t\t\t\t\t\turis: data.results.slice(fromIdx, toIdx + 1).map(({ resource }) => resource),\n\t\t\t\t\t\thasNextPage: (data.results.length - 1) - toIdx >= 1,\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tconst pages = await Promise.all(queryStrings.map(searchOne))\n\t\t\t\tconst seen = new Set<string>()\n\t\t\t\tconst uris: URI[] = []\n\t\t\t\tfor (const page of pages) for (const resultUri of page.uris) {\n\t\t\t\t\tconst key = resultUri.toString()\n\t\t\t\t\tif (!seen.has(key)) { seen.add(key); uris.push(resultUri) }\n\t\t\t\t}\n\t\t\t\treturn { result: { uris, hasNextPage: pages.some(page => page.hasNextPage) } }\n\t\t\t},`
          );

          // 7) Parallel semantic discovery too, capped to a compact merged hit set.
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/toolsService.ts',
            `\t\t\tsemantic_search: async ({ query, top_k }) => {\n\t\t\t\tconst hits = await this.semanticSearchService.search({ query, topK: top_k });\n\t\t\t\treturn {\n\t\t\t\t\tresult: {\n\t\t\t\t\t\thits: hits.map(h => ({\n\t\t\t\t\t\t\tfilePath: h.chunk.filePath,\n\t\t\t\t\t\t\tstartLine: h.chunk.startLine,\n\t\t\t\t\t\t\tendLine: h.chunk.endLine,\n\t\t\t\t\t\t\tscore: h.score,\n\t\t\t\t\t\t\tcontent: h.chunk.content\n\t\t\t\t\t\t}))\n\t\t\t\t\t}\n\t\t\t\t};\n\t\t\t},`,
            `\t\t\tsemantic_search: async ({ query, queries, top_k }) => {\n\t\t\t\tconst queryStrings = queries?.length ? queries : [query]\n\t\t\t\tconst topK = top_k ?? 5\n\t\t\t\tconst groups = await Promise.all(queryStrings.map(searchQuery => this.semanticSearchService.search({ query: searchQuery, topK })))\n\t\t\t\tconst seen = new Set<string>()\n\t\t\t\tconst hits = groups.flat().map(h => ({\n\t\t\t\t\tfilePath: h.chunk.filePath,\n\t\t\t\t\tstartLine: h.chunk.startLine,\n\t\t\t\t\tendLine: h.chunk.endLine,\n\t\t\t\t\tscore: h.score,\n\t\t\t\t\tcontent: h.chunk.content\n\t\t\t\t})).sort((a, b) => b.score - a.score).filter(hit => {\n\t\t\t\t\tconst key = \`\\${hit.filePath}:\\${hit.startLine}:\\${hit.endLine}:\\${hit.content}\`\n\t\t\t\t\tif (seen.has(key)) return false\n\t\t\t\t\tseen.add(key)\n\t\t\t\t\treturn true\n\t\t\t\t}).slice(0, Math.min(40, topK * queryStrings.length))\n\t\t\t\treturn { result: { hits } };\n\t\t\t},`
          );

          // 8) Persisted assistant sanitization must recognize every built-in tool and alias, not only approval-gated tools.
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/chatThreadService.ts',
            `import { chat_userMessageContent, isABuiltinToolName, normalizeRawParams, normalizeToolName } from '../common/prompt/prompts.js';`,
            `import { builtinToolNames, chat_userMessageContent, isABuiltinToolName, normalizeRawParams, normalizeToolName, toolNamesIncludingAliases } from '../common/prompt/prompts.js';`
          );
          replaceOnce(
            'src/vs/workbench/contrib/void/browser/chatThreadService.ts',
            `\t\t\tconst builtInToolNames = Object.keys(approvalTypeOfBuiltinToolName)\n\t\t\tconst registeredToolNames = [...mcpToolNames, ...builtInToolNames]`,
            `\t\t\tconst builtInToolNames = builtinToolNames.flatMap(toolNamesIncludingAliases)\n\t\t\tconst registeredToolNames = [...mcpToolNames, ...builtInToolNames]`
          );

          // 9) Guard the behavior so future refactors cannot silently remove it.
          replaceOnce(
            'scripts/forge-agent-tool-contract-test.mjs',
            `check(\n  'workspace paths are model-safe',`,
            `check(\n  'parallel read-only discovery is supported',\n  hasAll(toolTypes, ['uris?: URI[]', 'queries?: string[]'])\n    && hasAll(toolsService, [\n      'validateStringList',\n      'Promise.all(targets.map(readOne))',\n      'Promise.all(queryStrings.map(searchOne))',\n      'Promise.all(queryStrings.map(searchQuery => this.semanticSearchService.search',\n    ])\n    && hasAll(prompts, [\n      'JSON array of up to 6 file paths',\n      'batch up to 6 of them in one read_file/search call',\n      'parallel batching is for read-only discovery only',\n    ]),\n  'Independent file reads and discovery queries should execute concurrently without changing the canonical tool protocol or parallelizing edits.',\n);\n\ncheck(\n  'all built-in tool aliases are sanitized',\n  hasAll(chatService, [\n    'builtinToolNames.flatMap(toolNamesIncludingAliases)',\n    'const registeredToolNames = [...mcpToolNames, ...builtInToolNames]',\n  ]),\n  'Persisted assistant text must strip leaked calls for read/search tools as well as edit/terminal tools.',\n);\n\ncheck(\n  'workspace paths are model-safe',`
          );
          NODE

      - name: Run Forge agent/tool contract
