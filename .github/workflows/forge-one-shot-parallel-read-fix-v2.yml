          replace_once(
              'src/vs/workbench/contrib/void/browser/toolsService.ts',
              """\t\t\tread_file: async ({ uri, startLine, endLine, pageNumber }) => {
\t\t\t\tawait voidModelService.initializeModel(uri)
\t\t\t\tconst { model } = await voidModelService.getModelSafe(uri)
\t\t\t\tif (model === null) { throw new Error(`No contents; File does not exist.`) }

\t\t\t\tlet contents: string
\t\t\t\tif (startLine === null && endLine === null) {
\t\t\t\t\tcontents = model.getValue(EndOfLinePreference.LF)
\t\t\t\t}
\t\t\t\telse {
