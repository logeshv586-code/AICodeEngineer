name: Forge One-Shot Parallel Read Fix v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-one-shot-parallel-read-fix-v3.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/apply-forge-parallel-read-fix.py
      - name: Run Forge agent tool contract
        run: node scripts/forge-agent-tool-contract-test.mjs
      - name: Commit source changes
        run: |
          git config user.name 'forge-fix-bot'
          git config user.email 'forge-fix-bot@users.noreply.github.com'
          git add src/vs/workbench/contrib/void/common/toolsServiceTypes.ts \
                  src/vs/workbench/contrib/void/common/prompt/prompts.ts \
                  src/vs/workbench/contrib/void/browser/toolsService.ts \
                  src/vs/workbench/contrib/void/browser/chatThreadService.ts \
                  scripts/forge-agent-tool-contract-test.mjs
          git diff --cached --check
          git commit -m 'fix: parallelize Forge read-only discovery'
          git push origin HEAD:main
