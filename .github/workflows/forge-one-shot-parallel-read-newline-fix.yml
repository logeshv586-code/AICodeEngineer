name: Forge One-Shot Parallel Read Newline Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-one-shot-parallel-read-newline-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repair TypeScript escaping
        run: python3 scripts/fix-forge-parallel-read-newline.py
      - name: Re-run Forge agent tool contract
        run: node scripts/forge-agent-tool-contract-test.mjs
      - name: Verify diff whitespace
        run: git diff --check
      - name: Commit repair
        run: |
          git config user.name 'forge-fix-bot'
          git config user.email 'forge-fix-bot@users.noreply.github.com'
          git add src/vs/workbench/contrib/void/browser/toolsService.ts
          git commit -m 'fix: preserve Forge batch-read newline escapes'
          git push origin HEAD:main
