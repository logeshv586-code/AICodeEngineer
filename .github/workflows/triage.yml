name: Forge Issue Triage to Wiki

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  roadmap:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        id: secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not set - skipping Forge triage run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit
          fi
          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "WIKI_TOKEN is not set - skipping Forge triage run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout Forge
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check openai requests

      - name: Clone Forge Wiki
        if: steps.secrets.outputs.ready == 'true'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: git clone "https://x-access-token:${WIKI_TOKEN}@github.com/logeshv586-code/AICodeEngineer.wiki.git" wiki

      - name: Show Forge triage inputs
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "PWD: $(pwd)"
          ls -al .github/scripts
          test -f .github/scripts/issue_triage.py

      - name: Generate Forge roadmap and push if changed
        if: steps.secrets.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.WIKI_TOKEN }}
          FORGE_TRIAGE_REPO: logeshv586-code/AICodeEngineer
        run: |
          python .github/scripts/issue_triage.py > wiki/_new.md
          if ! cmp -s wiki/_new.md wiki/Issue-Categories.md ; then
            mv wiki/_new.md wiki/Issue-Categories.md
            cd wiki
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Issue-Categories.md
            git commit -m "Auto-update Forge Issue-Categories.md"
            git push
          else
            rm -f wiki/_new.md
            echo "No Forge roadmap change - skipping wiki update"
          fi
